[package]
name = "qingji"
version = "0.1.0"
description = "QINGJI Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# 开发环境配置
[profile.dev]
opt-level = 0       # 无优化，加快编译
debug = true        # 开启调试信息
overflow-checks = true

# 发布环境优化配置 - 关键！
[profile.release]
panic = "abort"     # 崩溃时直接终止，减小体积
codegen-units = 1   # 单线程编译，更好的优化
lto = true          # 链接时优化 (Link-Time Optimization)
opt-level = "s"     # 优化体积 (可选 "z" 更激进, "3" 优化性能)
strip = true        # 移除调试符号
debug = false       # 关闭调试信息

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qingji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Essential plugins for QINGJI
tauri-plugin-sql = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", features = ["sqlite"] }
tauri-plugin-os = "2.0.0"
tauri-plugin-window-state = "2.0.0"
tauri-plugin-store = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-http = "2.0.0"
tauri-plugin-log = "2.0.0"
# Mobile safe area insets
tauri-plugin-safe-area-insets = "0.1.0"

