name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # ─── Desktop: Windows / macOS / Linux ────────────────────────────
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            bundles: msi,nsis
          - os: macos-latest
            target: macos
            bundles: dmg
          - os: ubuntu-latest
            target: linux
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install

      - name: Build
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qingji-${{ matrix.target }}
          path: src-tauri/target/release/bundle/**/*

  # ─── Android ────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.1'

      - run: pnpm install

      - name: Setup signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using secret keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/qingji.keystore
          else
            echo "Generating self-signed keystore"
            keytool -genkey -v \
              -keystore src-tauri/gen/android/qingji.keystore \
              -alias qingji \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-release \
              -keypass ci-release \
              -dname "CN=QINGJI CI, OU=Dev, O=QINGJI, L=Unknown, ST=Unknown, C=CN" \
              -noprompt
          fi
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=qingji.keystore
          storePassword=${KEYSTORE_PASSWORD:-ci-release}
          keyAlias=${KEY_ALIAS:-qingji}
          keyPassword=${KEY_PASSWORD:-ci-release}
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APKs
        run: pnpm tauri android build --apk true --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: qingji-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  # ─── GitHub Release ────────────────────────────────────────────
  release:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qingji-*
          merge-multiple: true
          path: artifacts

      - run: ls -R artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
